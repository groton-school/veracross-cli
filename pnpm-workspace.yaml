publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '@commitlint/*'
  - commit-and-tag-version
  - lerna
  - monorepo-package-paths
  - npm-run-all
allowBuilds:
  '@openapitools/openapi-generator-cli': true
  nx: true
  puppeteer: true
packages:
  - examples/*
  - packages/*
  - '!/packages/oauth2-cli'
  - packages/oauth2-cli/*
minimumReleaseAgeExclude:
  - '@battis/*'
  - '@groton/*'
catalog:
  '@battis/descriptive-types': ^0.3.1
  '@battis/typescript-tricks': ^0.8.6
  '@tsconfig/node-lts': ^24.0.1
  '@types/express': ^5.0.6
  '@types/node': ^24.13.3
  del-cli: ^7.0.0
  express: ^5.2.1
  npm-run-all: ^4.1.5
  typescript: ^5.9.3
